# Public IP gray deployment template.
# Install as /etc/nginx/sites-available/multi-agent-arena and link it into
# /etc/nginx/sites-enabled/ after reviewing the source allowlist separately.

limit_req_zone $binary_remote_addr zone=solution_by_ip:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=evaluation_by_ip:10m rate=1r/m;

upstream multi_agent_arena_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/multi-agent-arena/frontend/current;
    index index.html;

    client_max_body_size 1m;
    access_log /var/log/nginx/multi-agent-arena.access.log;
    error_log /var/log/nginx/multi-agent-arena.error.log;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/solutions {
        limit_req zone=solution_by_ip burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://multi_agent_arena_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    location = /api/evaluations {
        # Temporary management allowlist for controlled production evaluation gray release.
        allow 36.248.198.60/32;
        deny all;

        limit_req zone=evaluation_by_ip nodelay;
        limit_req_status 429;
        proxy_pass http://multi_agent_arena_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 220s;
    }

    location /api/ {
        proxy_pass http://multi_agent_arena_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass http://multi_agent_arena_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}