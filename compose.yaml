services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    env_file:
      - .env.deploy
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - arena_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env.deploy
    environment:
      EVALUATION_HISTORY_COOKIE_SECURE: ${EVALUATION_HISTORY_COOKIE_SECURE:-true}
      EVALUATION_HISTORY_RETENTION_DAYS: ${EVALUATION_HISTORY_RETENTION_DAYS:-30}
      EVALUATION_RUNNING_STALE_MINUTES: ${EVALUATION_RUNNING_STALE_MINUTES:-10}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - arena_private
      - arena_sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  arena_private:
    driver: bridge
  arena_sandbox:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1

volumes:
  postgres_data: